[tools]
node = "24.18.0"

[env]
TYPESAFE_MODEL = "jev-latest"

[tasks.install]
description = "Install locked JavaScript dependencies"
run = "npm ci"

[tasks.test]
description = "Run the pack policy test suite"
run = "node --test test/*.test.mjs"

[tasks.decision]
description = "Run a judgment pack (see src/cli.mjs --help)"
run = "node src/cli.mjs"

[tasks.check]
description = "Syntax-check JavaScript and the migration script"
run = """
find src packs test skills -name '*.mjs' -type f -print0 | xargs -0 -n 1 node --check
python3 - <<'PYTHON'
import ast
from pathlib import Path
for path in Path("scripts").glob("*.py"):
    ast.parse(path.read_text(), filename=str(path))
PYTHON
"""
